e-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:14px}.panel{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.panelhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}.panelhead h2{font-size:16px;margin:0}#map{height:520px;z-index:1}.objects{max-height:520px;overflow:auto}.object{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}.object:hover{background:#f6faf8}.object strong{display:block}.object small{color:var(--muted)}.object .risk{font-size:11px;font-weight:700;color:#a33127}.object .meta{display:block;color:var(--muted);font-size:12px;margin-top:4px}.qrbox{display:grid;place-items:center;padding:18px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:12px 0}.qrbox canvas,.qrbox img{max-width:100%;height:auto}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.detailitem{background:#f4f8f6;padding:10px;border-radius:9px}.detailitem small{display:block;color:var(--muted)}.empty{padding:24px;color:var(--muted);text-align:center}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0;flex:1}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modal{position:fixed;inset:0;background:#071b20aa;z-index:3000;display:grid;place-items:center;padding:12px}.modalbox{width:min(100%,720px);max-height:92dvh;overflow:auto;background:white;border-radius:18px;padding:18px}.modalhead{display:flex;align-items:center;justify-content:space-between;gap:8px}.modalhead h2{font-size:18px;margin:0}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0}.tab{white-space:nowrap}.tab.active{background:var(--navy);color:white}.user{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.userline{display:flex;justify-content:space-between;gap:8px}.badge{font-size:11px;padding:4px 8px;border-radius:20px;background:#e8f5ef;color:#146347}.badge.off{background:#ffebe8;color:#a33127}.note{border-top:1px solid var(--line);padding:12px 0}.note p{margin:7px 0}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:5000;background:#102b32;color:white;padding:12px 16px;border-radius:12px;box-shadow:0 8px 30px #0003}.admin-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.admin-summary div{background:#f1f6f4;border-radius:10px;padding:10px}.admin-summary b{display:block;font-size:20px}@media(max-width:800px){.layout{grid-template-columns:1fr}#map{height:380px}.objects{max-height:320px}.apphead{align-items:flex-start}.stats{gap:7px}.stat{padding:10px}.stat b{font-size:19px}}@media(max-width:420px){.head-actions button{padding:9px}.apphead h1{font-size:16px}.wrap{padding:10px}.formgrid{grid-template-columns:1fr}}
</style></head><body>
<div id="auth" class="auth"><form id="authform" class="authbox"><div class="mark">⚠</div><h1 id="authtitle">Опасные объекты</h1><p id="authdesc">Войдите в рабочую систему</p><div id="setupfields" class="hidden"><div class="field"><label>Ключ первичной настройки</label><input id="setupkey" autocomplete="off"></div><div class="field"><label>Имя администратора</label><input id="displayname" autocomplete="name"></div></div><div class="field"><label>Логин</label><input id="username" required minlength="3" maxlength="32" autocomplete="username"></div><div class="field"><label>Пароль</label><input id="password" type="password" required autocomplete="current-password"></div><div id="authhint" class="muted hidden">Для первого администратора пароль должен содержать не менее 12 символов.</div><div id="autherror"></div><button id="authsubmit" class="primary">Войти</button></form></div>
<div id="main" class="hidden"><header class="apphead"><div><h1>⚠ Опасные объекты</h1><small id="who"></small></div><div class="head-actions"><button id="adminbtn" class="hidden">Админ-панель</button><button id="logout">Выйти</button></div></header><div class="wrap"><div class="stats"><div class="stat"><b id="objectcount">0</b><span>Объектов</span></div><div class="stat"><b id="notecount">0</b><span>Активных замечаний</span></div><div class="stat"><b id="usercount">—</b><span>Статус системы</span></div></div><div class="layout"><section class="panel"><div class="panelhead"><h2>Карта объектов</h2><button id="addobject" class="primary">+ Объект</button></div><div id="map"></div></section><section class="panel"><div class="panelhead"><h2>Список объектов</h2><input id="search" class="inline-input" placeholder="Поиск" style="max-width:160px"><select id="regionfilter" class="inline-input" style="max-width:160px"><option value="">Все регионы</option></select><select id="districtfilter" class="inline-input" style="max-width:160px"><option value="">Все районы</option></select></div><div id="objects" class="objects"></div></section></div></div></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2 id="modaltitle">Объект</h2><button id="closemodal">Закрыть ✕</button></div><div id="modalbody"></div></div></div><div id="toast" class="toast hidden"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const $=id=>document.getElementById(id);let me=null,objects=[],notes=[],map,markers={},activeTab='users';const api=async(path,method='GET',body)=>{const r=await fetch('/api'+path,{method,credentials:'same-origin',headers:body!==undefined?{'content-type':'application/json'}:{},body:body!==undefined?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({error:'Ошибка сервера'}));if(!r.ok)throw Error(d.error||'Ошибка');return d};const toast=m=>{$('toast').textContent=m;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function boot(){try{const s=await api('/auth/status');if(!s.initialized){$('authtitle').textContent='Первичная настройка';$('authdesc').textContent='Создайте главную учётную запись администратора';$('setupfields').classList.remove('hidden');$('authhint').classList.remove('hidden');$('authsubmit').textContent='Создать администратора';$('password').minLength=12;$('password').autocomplete='new-password';}else{try{me=(await api('/auth/me')).user;showApp()}catch{$('auth').classList.remove('hidden')}}}catch(e){$('autherror').innerHTML='<div class="error">Не удалось связаться с сервером: '+esc(e.message)+'</div>'}}
$('authform').onsubmit=async e=>{e.preventDefault();$('autherror').textContent='';$('authsubmit').disabled=true;try{const setup=!$('setupfields').classList.contains('hidden');if(setup){const r=await api('/auth/setup','POST',{setupKey:$('setupkey').value,username:$('username').value,password:$('password').value,displayName:$('displayname').value});me=r.user}else{me=(await api('/auth/login','POST',{username:$('username').value,password:$('password').value})).user}showApp()}catch(e){$('autherror').innerHTML='<div class="error">'+esc(e.message)+'</div>'}finally{$('authsubmit').disabled=false}};
$('logout').onclick=async()=>{await api('/auth/logout','POST',{});me=null;location.reload()};function showApp(){$('auth').classList.add('hidden');$('main').classList.remove('hidden');$('who').textContent=me.displayName+' · '+(me.role==='admin'?'Администратор':'Сотрудник');if(me.role==='admin')$('adminbtn').classList.remove('hidden');if(!map){map=L.map('map').setView([48.0,66.0],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}load();setInterval(load,10000)}
let qrOpened=false;async function load(){try{const d=await api('/data');objects=d.objects||[];notes=d.notes||[];render();const token=new URLSearchParams(location.search).get('qr');if(token&&!qrOpened){const found=objects.find(o=>o.qrToken===token);if(found){qrOpened=true;openObject(found.id);history.replaceState({},'',location.pathname)}}}catch(e){console.error(e)}}function render(){ $('objectcount').textContent=objects.length;$('notecount').textContent=notes.filter(n=>!n.resolved).length;$('usercount').textContent='На связи';const q=$('search').value.toLowerCase();const regions=[...new Set(objects.map(o=>(o.region||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));const rf=$('regionfilter'),df=$('districtfilter');const selectedRegion=rf.value,selectedDistrict=df.value;rf.innerHTML='<option value="">Все регионы</option>'+regions.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('');rf.value=regions.includes(selectedRegion)?selectedRegion:'';const districts=[...new Set(objects.filter(o=>!rf.value||o.region===rf.value).map(o=>(o.district||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));df.innerHTML='<option value="">Все районы</option>'+districts.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join('');df.value=districts.includes(selectedDistrict)?selectedDistrict:'';$('objects').innerHTML=objects.filter(o=>(!rf.value||o.region===rf.value)&&(!df.value||o.district===df.value)&&(o.name+' '+o.type+' '+(o.address||'')+' '+(o.district||'')+' '+(o.region||'')+' '+(o.inventoryCode||'')).toLowerCase().includes(q)).map(o=>{const ns=notes.filter(n=>n.objectId===o.id&&!n.resolved);const st={active:'Действующий',restricted:'Ограничен',maintenance:'На обслуживании',decommissioned:'Выведен'}[o.status]||'Действующий';return `<div class="object" data-id="${esc(o.id)}"><strong>${esc(o.name)}</strong><small>${esc(o.type)} · ${st} · ${ns.length} активных замечаний</small>${o.address||o.district?`<span class="meta">${esc([o.region,o.district,o.address].filter(Boolean).join(' · '))}</span>`:''}${o.inventoryCode?`<span class="meta">Инв. № ${esc(o.inventoryCode)}</span>`:''}${ns.length?'<div class="risk">⚠ Требует внимания</div>':''}</div>`}).join('')||'<div class="empty">Объектов пока нет</div>';document.querySelectorAll('.object').forEach(el=>el.onclick=()=>openObject(el.dataset.id));Object.values(markers).forEach(m=>map.removeLayer(m));markers={};objects.forEach(o=>{const marker=L.marker([o.lat,o.lng]).addTo(map).bindPopup(esc(o.name));marker.on('click',()=>openObject(o.id));markers[o.id]=marker})}
$('search').oninput=render;$('regionfilter').onchange=()=>{const d=$('districtfilter');d.value='';render()};$('districtfilter').onchange=render;$('addobject').onclick=()=>objectForm();function openModal(title,html){$('modaltitle').textContent=title;$('modalbody').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}$('closemodal').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};
function objectForm(o={}){openModal(o.id?'Изменить объект':'Новый объект',`<form id="objform"><div class="field"><label>Название объекта *</label><input name="name" required maxlength="120" value="${esc(o.name||'')}"></div><div class="field"><label>Тип объекта</label><select name="type">${['Базовая станция','Антенно-мачтовое сооружение','Шкаф связи','Опора','Техническое помещение','Другое'].map(t=>`<option ${o.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>Область / регион</label><input name="region" maxlength="100" placeholder="Например, Костанайская область" value="${esc(o.region||'')}"></div><div class="field"><label>Район</label><input name="district" maxlength="100" placeholder="Например, Амангельдинский район" value="${esc(o.district||'')}"></div><div class="field"><label>Адрес / ориентир</label><input name="address" maxlength="180" value="${esc(o.address||'')}"></div></div><div class="formgrid"><div class="field"><label>Инвентарный номер</label><input name="inventoryCode" maxlength="60" value="${esc(o.inventoryCode||'')}"></div><div class="field"><label>Ответственный</label><input name="responsible" maxlength="100" value="${esc(o.responsible||'')}"></div></div><div class="field"><label>Статус</label><select name="status"><option value="active" ${!o.status||o.status==='active'?'selected':''}>Действующий</option><option value="restricted" ${o.status==='restricted'?'selected':''}>Ограничен</option><option value="maintenance" ${o.status==='maintenance'?'selected':''}>На обслуживании</option><option value="decommissioned" ${o.status==='decommissioned'?'selected':''}>Выведен из эксплуатации</option></select></div><div class="field"><label>Описание</label><textarea name="description" rows="2" maxlength="1500">${esc(o.description||'')}</textarea></div><div class="formgrid"><div class="field"><label>Широта *</label><input name="lat" type="number" step="any" required value="${o.lat??''}"></div><div class="field"><label>Долгота *</label><input name="lng" type="number" step="any" required value="${o.lng??''}"></div></div><button class="primary">${o.id?'Сохранить изменения':'Добавить объект'}</button></form>`);$('objform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const v=Object.fromEntries(f);v.lat=Number(v.lat);v.lng=Number(v.lng);try{if(o.id)await api('/objects/'+o.id,'PUT',v);else await api('/objects','POST',v);closeModal();await load();toast('Объект сохранён')}catch(e){toast(e.message)}}}
function openObject(id){const o=objects.find(x=>x.id===id);if(!o)return;const ns=notes.filter(n=>n.objectId===id);const st={active:'Действующий',restricted:'Ограничен',maintenance:'На обслуживании',decommissioned:'Выведен из эксплуатации'}[o.status]||'Действующий';openModal(o.name,`<p class="muted">${esc(o.type)} · ${Number(o.lat).toFixed(5)}, ${Number(o.lng).toFixed(5)}</p><div class="detailgrid"><div class="detailitem"><small>Статус</small><b>${st}</b></div><div class="detailitem"><small>Инвентарный №</small><b>${esc(o.inventoryCode||'—')}</b></div><div class="detailitem"><small>Область / регион</small><b>${esc(o.region||'—')}</b></div><div class="detailitem"><small>Район</small><b>${esc(o.district||'—')}</b></div><div class="detailitem"><small>Адрес</small><b>${esc(o.address||'—')}</b></div><div class="detailitem"><small>Ответственный</small><b>${esc(o.responsible||'—')}</b></div></div>${o.description?`<p>${esc(o.description)}</p>`:''}<div class="row" style="margin-top:12px"><button id="editobj">Изменить</button><button id="showqr" class="primary">QR-код</button><button id="delobj" class="danger">Удалить</button></div><div id="qrpanel" class="hidden"><div class="qrbox"><div id="qrcode"></div></div><p class="muted" style="text-align:center">Отсканируйте код, чтобы открыть карточку объекта после входа в систему.</p><div class="row"><button id="printqr">Печать QR</button><button id="copyqr">Копировать ссылку</button></div></div><h3>Замечания</h3><div id="notes">${ns.map(n=>`<div class="note"><b>${esc(n.cat)} · уровень ${n.sev}</b><p>${esc(n.text)}</p><small class="muted">${esc(n.author)} · ${new Date(n.ts).toLocaleString()}</small>${n.resolved?'<span class="badge">Закрыто</span>':me.role==='admin'?`<button data-resolve="${n.id}" class="primary">Закрыть замечание</button>`:''}</div>`).join('')||'<p class="muted">Замечаний пока нет</p>'}</div><h3>Добавить замечание</h3><form id="noteform"><div class="field"><label>Категория</label><select name="cat"><option value="structure">Конструкция</option><option value="electric">Электрика</option><option value="road">Доступ / дорога</option><option value="access">Доступ</option><option value="animals">Животные</option><option value="other">Другое</option></select></div><div class="field"><label>Уровень опасности</label><select name="sev"><option value="1">Низкий</option><option value="2">Средний</option><option value="3">Высокий</option></select></div><div class="field"><label>Описание</label><textarea name="text" required maxlength="4000" rows="3"></textarea></div><button class="primary">Отправить замечание</button></form>`);$('editobj').onclick=()=>objectForm(o);$('showqr').onclick=()=>{const panel=$('qrpanel');panel.classList.toggle('hidden');if(!panel.classList.contains('hidden')){const target=location.origin+'/?qr='+encodeURIComponent(o.qrToken);$('qrcode').innerHTML='';if(window.QRCode)new QRCode($('qrcode'),{text:target,width:220,height:220,colorDark:'#102b32',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});else $('qrcode').textContent='Не удалось загрузить генератор QR. Проверьте подключение к интернету.';$('copyqr').onclick=()=>navigator.clipboard?.writeText(target).then(()=>toast('Ссылка скопирована')).catch(()=>toast(target));$('printqr').onclick=()=>{const win=window.open('','_blank');if(!win)return toast('Разрешите всплывающие окна для печати');win.document.write('<title>QR '+esc(o.name)+'</title><body style="font-family:Arial;text-align:center;padding:30px"><h2>'+esc(o.name)+'</h2><div id="code"></div><p>'+esc(o.inventoryCode||o.type)+'</p><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\\/script><script>new QRCode(document.getElementById("code"),{text:'+JSON.stringify(target)+',width:280,height:280});window.onload=()=>window.print()<\\/script></body>');win.document.close()}}};$('delobj').onclick=async()=>{if(confirm('Удалить объект и все замечания?')){try{await api('/objects/'+id,'DELETE');closeModal();await load();toast('Удалено')}catch(e){toast(e.message)}}};$('noteform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/objects/'+id+'/notes','POST',{cat:f.get('cat'),sev:Number(f.get('sev')),text:f.get('text'),author:me.displayName});closeModal();await load();toast('Замечание отправлено')}catch(e){toast(e.message)}};document.querySelectorAll('[data-resolve]').forEach(b=>b.onclick=async()=>{await api('/notes/'+b.dataset.resolve+'/resolve','POST',{resolved:true});closeModal();await load();toast('Замечание закрыто')})}
$('adminbtn').onclick=adminPanel;async function adminPanel(){try{const d=await api('/admin/users');const u=d.users;openModal('Панель администратора',`<div class="admin-summary"><div><b>${u.length}</b><small>Пользователей</small></div><div><b>${u.filter(x=>x.active).length}</b><small>Активных</small></div><div><b>${objects.length}</b><small>Объектов</small></div></div><div class="tabs"><button class="tab active" data-tab="users">Пользователи</button><button class="tab" data-tab="objects">Объекты</button><button class="tab" data-tab="notes">Замечания</button></div><div id="admintab"></div>`);const show=tab=>{activeTab=tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='users')$('admintab').innerHTML=`<h3>Создать учётную запись</h3><form id="newuser"><div class="formgrid"><div class="field"><label>Логин</label><input name="username" required minlength="3" maxlength="32"></div><div class="field"><label>Имя</label><input name="displayName" required></div></div><div class="field"><label>Пароль (не менее 12 символов)</label><input name="password" type="password" required minlength="12"></div><div class="field"><label>Роль</label><select name="role"><option value="employee">Сотрудник</option><option value="admin">Администратор</option></select></div><button class="primary">Создать пользователя</button></form><h3>Список пользователей</h3>${u.map(x=>`<div class="user"><div class="userline"><b>${esc(x.displayName)} (@${esc(x.username)})</b><span class="badge ${x.active?'':'off'}">${x.active?'Активен':'Отключён'}</span></div><small>${x.role==='admin'?'Администратор':'Сотрудник'} · вход: ${x.lastLogin?new Date(x.lastLogin).toLocaleString():'не было'}</small><div class="row" style="margin-top:10px"><button data-toggle="${x.id}" ${x.id===me.id?'disabled':''}>${x.active?'Отключить':'Включить'}</button><select data-role="${x.id}" ${x.id===me.id?'disabled':''}><option value="employee" ${x.role==='employee'?'selected':''}>Сотрудник</option><option value="admin" ${x.role==='admin'?'selected':''}>Администратор</option></select></div><div class="row" style="margin-top:8px"><input class="inline-input" type="password" placeholder="Новый пароль 12+" data-pass="${x.id}"><button data-reset="${x.id}">Сменить пароль</button></div></div>`).join('')}`;else if(tab==='objects')$('admintab').innerHTML=objects.map(o=>`<div class="user"><b>${esc(o.name)}</b><p class="muted">${esc(o.type)} · ${esc(o.createdBy||'')}</p><button data-edit="${o.id}">Редактировать</button></div>`).join('')||'<p>Нет объектов</p>';else $('admintab').innerHTML=notes.map(n=>`<div class="user"><b>${esc(n.cat)} · ${esc(n.text)}</b><p class="muted">${esc(n.author)} · ${new Date(n.ts).toLocaleString()}</p><span class="badge ${n.resolved?'':'off'}">${n.resolved?'Закрыто':'Открыто'}</span></div>`).join('')||'<p>Нет замечаний</p>';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));if(tab==='users'){$('newuser').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/admin/users','POST',Object.fromEntries(f));toast('Пользователь создан');adminPanel()}catch(e){toast(e.message)}};document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{await api('/admin/users/'+b.dataset.toggle,'PATCH',{active:b.textContent==='Отключить'?false:true});adminPanel()});document.querySelectorAll('[data-role]').forEach(s=>s.onchange=async()=>{await api('/admin/users/'+s.dataset.role,'PATCH',{role:s.value});adminPanel()});document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=async()=>{const p=document.querySelector('[data-pass="'+b.dataset.reset+'"]').value;if(p.length<12)return toast('Пароль минимум 12 символов');try{await api('/admin/users/'+b.dataset.reset,'PATCH',{password:p});toast('Пароль изменён');adminPanel()}catch(e){toast(e.message)}})}else if(tab==='objects')document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>objectForm(objects.find(o=>o.id===b.dataset.edit)));};show('users')}catch(e){toast(e.message)}}
boot();
</script></body></html>
